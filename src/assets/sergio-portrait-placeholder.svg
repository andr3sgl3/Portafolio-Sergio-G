  <text x="160" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#E9E5DA" text-anchor="middle" letter-spacing="0.5">ESPACIO PARA FOTOGRAFÍA PERSONAL</text>
