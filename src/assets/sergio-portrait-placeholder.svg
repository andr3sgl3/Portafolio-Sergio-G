      <stop offset="100%" stop-color="#171513"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D86A45" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D7D27A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background Frame -->
  <rect width="320" height="400" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="318" height="398" rx="11" fill="none" stroke="#D86A45" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 4"/>
  
